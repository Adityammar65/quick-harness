[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-harness-generator"
version = "0.1.0"
description = "Generate an AI coding agent harness: AGENTS.md, documentation scaffolding, and reusable skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["catalog.json", "templates/*.j2", "templates/roles/*.j2", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
